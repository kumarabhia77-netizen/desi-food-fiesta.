name: Build APK

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ca-app-pub-1101387414758437~3417408277
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - run: |
          mkdir www && cp index.html www/index.html
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="'"$ADMOB_APP_ID"'"/></application>#' $M
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' $M
          if [ -f DesiFoodFiesta-android-res.zip ]; then
            R=android/app/src/main/res
            rm -f $R/drawable/ic_launcher_background.xml $R/drawable-v24/ic_launcher_foreground.xml
            unzip -o DesiFoodFiesta-android-res.zip -d android/app/src/main
          fi
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: DesiFoodFiesta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk