#pb{height:10px;background:var(--card);border-radius:9px;overflow:hidden;margin:0 auto 10px;width:var(--bs)}#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff5a7a,#ffb02e,#5fd68a);transition:width .4s}
.t.s1,.t.s2,.t.s3{z-index:1;font-size:calc(var(--bs)/8*.95);transform:scale(1.2);animation:br 1.2s ease-in-out infinite}@keyframes br{50%{transform:scale(1.32)}}.t.s3{animation:hue 2s linear infinite,br 1.2s ease-in-out infinite}.t.s1{background:linear-gradient(135deg,#ffe28a,#ff9f43)}.t.s2{background:radial-gradient(circle,#ffd1d9,#ff5a7a)}
.t.jel:not(.s1):not(.s2):not(.s3){background:linear-gradient(160deg,#f2f5f7,#aab6c0);box-shadow:inset 0 0 0 3px #7d8a96,inset 0 2px 0 rgba(255,255,255,.6)}
#mas{display:flex;align-items:center;gap:10px;margin-bottom:8px}#ms{font-size:46px;line-height:1}#ms.jp{animation:jp .5s}@keyframes jp{30%{transform:translateY(-14px) rotate(-12deg) scale(1.25)}60%{transform:rotate(10deg)}}#bub{background:var(--card);padding:8px 14px;border-radius:16px 16px 16px 4px;font-weight:600}

.t.jel2:not(.s1):not(.s2):not(.s3){background:linear-gradient(160deg,#8e9aa6,#4f5b66);box-shadow:inset 0 0 0 3px #2c343b}

$('#rcp').onclick=()=>showList('<h2>Recipe Book</h2>'+RB.map(r=>'<p>'+(S.unlocked>=r[2]?r[0]+' '+r[1]:'🔒 Reach level '+r[2])+'</p>').join(''));
$('#dch').onclick=()=>intro(1000+Math.floor(Date.now()/864e5)%365);
// ===== Booster inventory, Fish Fry booster, Time Rush timer =====
let timed=false,tl=0,tt=0;
const can=b=>(S.inv&&S.inv[b[0]]>0)||S.coins>=b[3];
function pay(b){S.inv=S.inv||{};if(S.inv[b[0]]>0)S.inv[b[0]]--;else S.coins-=b[3]}
async function useFish(){busy=true;pay(BO.find(x=>x[0]==='fs'));S.bo=(S.bo||0)+1;mp('m3');save();const all=[...Array(64).keys()].sort(()=>Math.random()-.5),pl=all.filter(i=>J[i]),set=new Set([...new Set([...pl,...all])].slice(0,3)),f=document.createElement('span');f.textContent='🐟';f.className='fish';$('#bw').appendChild(f);setTimeout(()=>f.remove(),950);sfx.sp();hud();await sleep(500);await cascade(set,null);await finish()}
function tick(){clearInterval(tt);tt=setInterval(()=>{if($('#game').hidden)return clearInterval(tt);tl--;hud();if(tl<=0){clearInterval(tt);busy=true;over=true;timeUp()}},1000)}
function timeUp(){mood('sad');sfx.lose();show('<h2>Time is up! ⏱</h2><p>So close. Try again?</p><button class="btn" id="rt">Retry</button><button class="btn alt" id="mp">Level map</button>');$('#rt').onclick=()=>{close();start(cur)};$('#mp').onclick=toMap}
$('#trh').onclick=()=>intro(2000+Math.floor(Date.now()/864e5)%365);
(()=>{const h=document.documentElement;if((navigator.deviceMemory||4)<=4||(navigator.hardwareConcurrency||4)<=4)h.classList.add('lite');document.addEventListener('visibilitychange',()=>h.classList.toggle('hid',document.hidden));const fe=['🍔','🍕','🥟','🌯','🍢','🌀'];for(let i=0;i<10;i++){const e=document.createElement('span');e.className='fe';e.textContent=fe[i%6];e.style.cssText='left:'+(i*10+2)+'%;font-size:'+(24+i%3*10)+'px;animation-duration:'+(9+i%5*2)+'s;animation-delay:-'+(i*1.3)+'s';$('#sp').appendChild(e)}})();(()=>{for(let i=0;i<12;i++){const e=document.createElement('i'),z=8+i%4*6;e.style.cssText='left:'+(i*8.3)+'%;width:'+z+'px;height:'+z+'px;--dx:'+((i%3-1)*40)+'px;animation-duration:'+(7+i%5*2)+'s;animation-delay:-'+(i*1.1)+'s';$('#bgm').appendChild(e)}
for(let i=0;i<14;i++){const e=document.createElement('b');e.textContent=i%3?'✦':'✧';e.style.cssText='left:'+(i*7.1%96)+'%;top:'+((i*37)%90)+'%;font-size:'+(10+i%4*5)+'px;animation-duration:'+(2+i%4)+'s;animation-delay:-'+(i*.7)+'s';$('#bgg').appendChild(e)}})();
$('#pv').onclick=e=>{e.preventDefault();privacyUI()};initAds().then(()=>{if(!$('#map').hidden)showBanner()});buildDock();busy=true;drawMap();
try{const A=Capacitor.Plugins.App;A.addListener('backButton',()=>{if(!$('#sp').hidden)return A.exitApp();if(!$('#modal').hidden)return $('#cl')?close():0;if(!$('#game').hidden)return busy?0:toMap();A.exitApp()})}catch(e){}
</script></body></html>
